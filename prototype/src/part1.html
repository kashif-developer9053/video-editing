<title>Scrollcast Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
  :root{
    color-scheme: dark;
    --ground:#0D0F14; --panel:#161A22; --panel-2:#1C212B; --rule:#252B36;
    --text:#E8EAEF; --muted:#8A93A6; --dim:#5E6779;
    --accent:#F0A830; --accent-dim:#8A6320; --ok:#4ADE80; --rec:#F05050;
    --stage:#07080B;
    --ui:"Inter",system-ui,-apple-system,sans-serif;
    --disp:"Barlow Condensed",var(--ui);
    --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--ground); color:var(--text);
    font-family:var(--ui); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px}
  ::-webkit-scrollbar-thumb:hover{background:#333B49}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}

  /* ---------- shell ---------- */
  .app{display:flex;flex-direction:column;height:100%;min-height:0}
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 18px; padding-top:calc(10px + env(safe-area-inset-top,0px));
    background:var(--panel); border-bottom:1px solid var(--rule); flex:none;
  }
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
  .brand h1{
    font-family:var(--disp); font-weight:700; font-size:21px; margin:0;
    letter-spacing:.055em; text-transform:uppercase;
  }
  .brand h1 span{color:var(--accent)}
  .brand em{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
  .free-tag{
    font-family:var(--mono);font-size:10px;color:var(--ok);
    border:1px solid rgba(74,222,128,.32);background:rgba(74,222,128,.08);
    padding:3px 8px;border-radius:999px;letter-spacing:.06em;
  }

  .main{display:grid;grid-template-columns:minmax(0,1fr) 352px;flex:1;min-height:0}

  /* ---------- stage ---------- */
  .stage-wrap{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--stage)}
  .stage{
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:22px;position:relative;
    background-image:radial-gradient(circle at 50% 40%, #12151C 0%, #07080B 72%);
  }
  #preview{
    max-width:100%;max-height:100%;display:block;border-radius:2px;
    box-shadow:0 0 0 1px var(--rule), 0 26px 70px rgba(0,0,0,.72);
    background:#000;
  }
  .drop{
    position:absolute;inset:22px;border:1.5px dashed var(--rule);border-radius:6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;transition:border-color .15s,background .15s;
  }
  .drop.hot{border-color:var(--accent);background:rgba(240,168,48,.05)}
  .drop svg{width:42px;height:42px;stroke:var(--dim);fill:none;stroke-width:1.4}
  .drop h2{font-family:var(--disp);font-size:24px;font-weight:600;margin:0;letter-spacing:.03em;text-transform:uppercase}
  .drop p{margin:0;color:var(--muted);max-width:42ch;font-size:13px}
  .drop small{color:var(--dim);font-size:11px;font-family:var(--mono)}

  /* ---------- transport ---------- */
  .transport{
    flex:none;border-top:1px solid var(--rule);background:var(--panel);
    padding:11px 18px;display:flex;flex-direction:column;gap:9px;
  }
  .scrub{display:flex;align-items:center;gap:13px}
  .play{
    width:38px;height:38px;flex:none;border-radius:50%;border:1px solid var(--rule);
    background:var(--panel-2);display:grid;place-items:center;cursor:pointer;transition:.15s;
  }
  .play:hover:not(:disabled){border-color:var(--accent);background:#222835}
  .play:disabled{opacity:.34;cursor:not-allowed}
  .play svg{width:15px;height:15px;fill:var(--text)}
  input[type=range]{
    -webkit-appearance:none;appearance:none;background:transparent;flex:1;min-width:0;height:18px;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--rule);border-radius:3px}
  input[type=range]::-moz-range-track{height:3px;background:var(--rule);border-radius:3px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--accent);
    margin-top:-5px;border:2px solid var(--panel);
  }
  input[type=range]::-moz-range-thumb{width:13px;height:13px;border:2px solid var(--panel);border-radius:50%;background:var(--accent)}
  input[type=range]:disabled{opacity:.36}
  .tc{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tc b{color:var(--text);font-weight:500}
  .statusline{
    display:flex;align-items:center;gap:9px;font-size:11.5px;color:var(--dim);
    font-family:var(--mono);flex-wrap:wrap;
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
  .dot.ready{background:var(--ok);box-shadow:0 0 7px rgba(74,222,128,.55)}
  .dot.rec{background:var(--rec);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.dot.rec{animation:none}}
