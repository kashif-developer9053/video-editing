# Nginx site for Scrollcast.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/scrollcast
#   sudo sed -i 's/YOUR_DOMAIN/video.example.com/g' /etc/nginx/sites-available/scrollcast
#   sudo ln -sf /etc/nginx/sites-available/scrollcast /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Change 3009 if you started the app on a different port. Other sites on this
# server are untouched — each one is its own file in sites-available.

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # A PDF and a music track go up in one request; the default 1MB rejects
    # anything real with a confusing 413.
    client_max_body_size 150M;

    # Rendering a long video takes minutes. The defaults cut the connection
    # at 60 seconds, which shows up as the progress bar freezing near the end.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    send_timeout 3600s;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The finished video is streamed straight from disk. Buffering it
        # writes the whole file to a temp file first, which doubles the wait
        # and can fill /var on a small server.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Next's build output is content-hashed, so it can be cached hard.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
