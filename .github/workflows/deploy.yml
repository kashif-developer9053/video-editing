# Deploys to the VPS on every push to main.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions):
#   VPS_HOST         your server's IP or hostname
#   VPS_USER         the user that owns the app directory
#   VPS_SSH_KEY      a private key whose public half is in that user's
#                    ~/.ssh/authorized_keys
#   VPS_PORT         SSH port, usually 22
#
# The build runs here first, so a broken commit never reaches the server.

name: Deploy

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing anything.
  workflow_dispatch:

# One deploy at a time. Without this, two quick pushes race each other on
# the server and the second can restart mid-build of the first.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-canvas compiles from source and needs these headers.
      - name: Install build libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential libcairo2-dev libpango1.0-dev libjpeg-dev \
            libgif-dev librsvg2-dev

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src --max-warnings=0
      - run: npm run build

  deploy:
    name: Deploy to VPS
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Pull and restart over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          # node-canvas can take a few minutes to compile when dependencies
          # change, so the default timeout is too tight.
          command_timeout: 20m
          script: |
            set -e
            cd ~/apps/scrollcast
            bash deploy/deploy.sh
